name: waygu-video
id: dev.nsgo.wayguvideo
version: 0.1.0

i18n:
  dir: locales
  source: en

apple:
  requires_full_screen: false
  info:
    NSLocalNetworkUsageDescription: Connect to media servers on your local network.
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true

android:
  loopback_cleartext: true

icon:
  png: assets/Icon.png

dev:
  # native: this machine's backend; web: the browser; ios: a connected iPhone; ios_simulator; android: a connected device or emulator.
  target: native
  # true, the default, rebuilds and restarts on save; false runs once and exits with the app.
  hot_reload: true

build:
  output: dist
  # true opens the output directory after building.
  open: false
  targets: [macos_x64, macos_arm64, linux_x64, linux_arm64, windows_x64, windows_arm64, android_arm64, ios, tvos, harmonyos, web]
