name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waygu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, target: macos_x64, native: macos}
          - {runner: macos-26, target: macos_arm64, native: macos}
          - {runner: ubuntu-24.04, target: linux_x64, native: linux}
          - {runner: ubuntu-24.04-arm, target: linux_arm64, native: linux}
          - {runner: windows-2025, target: windows_x64, native: windows}
          - {runner: windows-11-arm, target: windows_arm64, native: windows}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check and test
        shell: bash
        run: |
          go tool nsgo check -target ${{ matrix.target }}
          go tool nsgo test . -count=1 -v
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 xvfb xauth gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Native window smoke test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a go tool nsgo test -target linux -run '^(TestChineseAppName|TestSkipOnboarding|TestNativeVideoDecodes)$' -timeout 2m .
      - name: Native window smoke test
        if: runner.os != 'Linux'
        run: go tool nsgo test -target ${{ matrix.native }} -run '^(TestChineseAppName|TestSkipOnboarding|TestNativeVideoDecodes)$' -timeout 2m .
      - name: Package desktop app
        shell: bash
        run: |
          go tool nsgo build -target ${{ matrix.target }} -installers=false
          tar -czf waygu-video-${{ matrix.target }}.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waygu-video-${{ matrix.target }}
          path: waygu-video-${{ matrix.target }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  apple:
    name: iOS and tvOS
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Apple device targets
        run: go tool nsgo check -target ios,tvos,ios_simulator,tvos_simulator -jobs 2
      - name: Build unsigned device IPAs
        run: go tool nsgo build -target ios,tvos -output dist/apple-devices -jobs 2 -installers=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waygu-video-apple-device-unsigned
          path: dist/apple-devices/releases/
          retention-days: 7
          if-no-files-found: error
      - name: Build simulator apps
        run: go tool nsgo build -target ios_simulator,tvos_simulator -output dist/apple-simulators -jobs 2 -installers=false
      - name: Archive simulator apps
        run: tar -czf waygu-video-apple-simulators.tar.gz -C dist/apple-simulators .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waygu-video-apple-simulators
          path: waygu-video-apple-simulators.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Test on iPhone, iPad and Apple TV
        run: |
          set -euo pipefail
          device() {
            xcrun simctl list devices available -j | jq -er --arg kind "$1" '
              [.devices | to_entries[] | select(.key | test("iOS-|tvOS-"))]
              | sort_by(.key | split("-") | .[1:] | map(tonumber)) | reverse
              | map(.value[] | select(.deviceTypeIdentifier | contains($kind)))
              | first | .udid'
          }
          run_simulator() {
            report=$(mktemp)
            if go tool nsgo test "$@" 2>&1 | tee "$report"; then
              return
            fi
            if grep -Fq 'the simulator app ended without its exit code' "$report" && grep -Eq ' [0-9]+ passed, 1 failed, [0-9]+ skipped' "$report"; then
              go tool nsgo test "$@"
              return
            fi
            return 1
          }
          failed=0
          for kind in iPhone iPad Apple-TV; do
            if ! simulator=$(device "$kind"); then
              echo "::error::No available $kind simulator"
              failed=1
              continue
            fi
            target=ios_simulator
            navigation=TestSkipOnboarding
            if [[ "$kind" == Apple-TV ]]; then
              target=tvos_simulator
              navigation=TestTVNavigation
            fi
            echo "::group::$kind simulator tests"
            run_simulator -target "$target" -device "$simulator" -run "^(TestChineseAppName|$navigation|TestNativeVideoDecodes)$" -timeout 2m . || failed=1
            xcrun simctl shutdown "$simulator" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  mobile-packages:
    name: Android, HarmonyOS and Web packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the packages
        run: go tool nsgo check -target android_arm64,harmonyos,web -jobs 2
      - name: Package the app
        run: |
          sh build/android/package.sh -installers=false
          go tool nsgo build -target harmonyos,web -jobs 2 -installers=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-harmonyos-web
          path: dist/releases/
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android / ${{ matrix.form }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {form: phone, api: 35, image: google_apis, profile: pixel_7}
          - {form: tablet, api: 35, image: google_apis, profile: pixel_tablet}
          - {form: tv, api: 36, image: android-tv, profile: tv_1080p}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Free disk space for Android virtual devices
        env:
          ANDROID_API: ${{ matrix.api }}
        run: |
          retained_ndk=$(realpath "$ANDROID_NDK_HOME")
          unused=()
          for ndk in "$ANDROID_HOME"/ndk/*; do
            if [ -f "$ndk/source.properties" ] && [ "$(realpath "$ndk")" != "$retained_ndk" ]; then
              unused+=("ndk;${ndk##*/}")
            fi
          done
          for platform in "$ANDROID_HOME"/platforms/*; do
            if [ -f "$platform/source.properties" ] && [ "${platform##*/}" != "android-$ANDROID_API" ]; then
              unused+=("platforms;${platform##*/}")
            fi
          done
          if (( ${#unused[@]} )); then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall "${unused[@]}"
          fi
          if command -v rustup >/dev/null; then
            rustup toolchain list | awk 'NF && $1 !~ /^no$/ {print $1}' | xargs -r rustup toolchain uninstall
          fi
          df -h "$ANDROID_HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android28-clang"
      - name: Build the Android TV launcher APK
        if: matrix.form == 'tv'
        run: sh build/android/package.sh -target android_x64 -output dist/android-tv
      - name: Run Android UI smoke tests
        if: matrix.form != 'tv'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          emulator-boot-timeout: 240
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect
          pre-emulator-launch-script: df -h "$ANDROID_AVD_HOME"
          script: sh build/android/emulator-test.sh ${{ matrix.form }}
      - name: Run the installed Android TV smoke test
        if: matrix.form == 'tv'
        env:
          ANDROID_IMAGE: system-images;android-${{ matrix.api }};${{ matrix.image }};x86_64
          ANDROID_PROFILE: ${{ matrix.profile }}
        run: sh build/android/run-tv-emulator.sh
      - name: Collect kernel diagnostics on failure
        if: failure()
        run: sudo dmesg --ctime --level=err,warn | tail -80

  integration:
    name: Docker media servers and libmpv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmpv2
      - name: Start fixture servers
        run: |
          sh integration/servers/fixtures.sh
          docker compose -f integration/servers/compose.yaml up -d --wait --wait-timeout 150
          python3 integration/servers/bootstrap.py
      - name: Test playback and server compatibility
        env:
          GOFLAGS: "-p=1"
          WAYGU_TEST_SERVERS: "1"
          WAYGU_TEST_MPV: "1"
        run: go tool nsgo test ./... -count=1 -v
      - name: Collect logs for a failed test
        if: failure()
        run: docker compose -f integration/servers/compose.yaml logs --tail=80
      - name: Stop fixture servers
        if: always()
        run: docker compose -f integration/servers/compose.yaml down
