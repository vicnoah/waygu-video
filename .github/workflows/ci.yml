name: Build and test

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        type: choice
        default: all
        options: [all, desktop, desktop-macos, apple, apple-tv]

permissions:
  contents: read

concurrency:
  group: waygu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: inputs.scope == 'all' || inputs.scope == 'desktop' || inputs.scope == 'desktop-macos'
    name: Desktop / ${{ matrix.target }}
    runs-on: >-
      ${{ fromJSON('{"macos_x64":"macos-15-intel","macos_arm64":"macos-26",
      "linux_x64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm",
      "windows_x64":"windows-2025","windows_arm64":"windows-11-arm"}')[matrix.target] }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{ fromJSON(inputs.scope == 'desktop-macos' && '["macos_x64","macos_arm64"]'
          || '["macos_x64","macos_arm64","linux_x64","linux_arm64","windows_x64","windows_arm64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check and test
        shell: bash
        run: |
          go tool nsgo check -target ${{ matrix.target }}
          go tool nsgo test . -count=1 -v
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libgtk-4-1 xvfb xauth gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Native window smoke test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a go tool nsgo test -target linux -run '^(TestChineseAppName|TestSkipOnboarding|TestNativeVideoDecodes|TestDesktopSidebarCounts)$' -timeout 2m -screenshots desktop-review .
      - name: Native window smoke test
        if: runner.os != 'Linux'
        env:
          NATIVE_TARGET: ${{ runner.os == 'macOS' && 'macos' || 'windows' }}
        shell: bash
        run: go tool nsgo test -target "$NATIVE_TARGET" -run '^(TestChineseAppName|TestSkipOnboarding|TestNativeVideoDecodes|TestDesktopSidebarCounts)$' -timeout 2m -screenshots desktop-review .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waygu-video-${{ matrix.target }}-review
          path: desktop-review/
          retention-days: 7
          if-no-files-found: error
      - name: Package desktop app
        shell: bash
        run: |
          go tool nsgo build -target ${{ matrix.target }} -installers=false
          tar -czf waygu-video-${{ matrix.target }}.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waygu-video-${{ matrix.target }}
          path: waygu-video-${{ matrix.target }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  apple:
    if: inputs.scope == 'all' || inputs.scope == 'apple' || inputs.scope == 'apple-tv'
    name: iOS and tvOS
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Apple device targets
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          targets=ios,tvos,ios_simulator,tvos_simulator
          if [[ "$SCOPE" == apple-tv ]]; then
            targets=tvos,tvos_simulator
          fi
          sh build/apple/package.sh check -target "$targets" -jobs 2
      - name: Package macOS for Intel and Apple silicon
        if: inputs.scope == 'apple'
        run: |
          go tool nsgo build -target macos -output dist/apple-desktop -jobs 2 -installers=false
          tar -czf waygu-video-macos.tar.gz -C dist/apple-desktop .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.scope == 'apple'
        with:
          name: waygu-video-macos
          path: waygu-video-macos.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Build unsigned device IPAs
        if: inputs.scope != 'apple-tv'
        run: sh build/apple/package.sh build -target ios,tvos -output dist/apple-devices -jobs 2 -installers=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.scope != 'apple-tv'
        with:
          name: waygu-video-apple-device-unsigned
          path: dist/apple-devices/releases/
          retention-days: 7
          if-no-files-found: error
      - name: Build simulator apps
        if: inputs.scope != 'apple-tv'
        run: sh build/apple/package.sh build -target ios_simulator,tvos_simulator -output dist/apple-simulators -jobs 2 -installers=false
      - name: Archive simulator apps
        if: inputs.scope != 'apple-tv'
        run: tar -czf waygu-video-apple-simulators.tar.gz -C dist/apple-simulators .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.scope != 'apple-tv'
        with:
          name: waygu-video-apple-simulators
          path: waygu-video-apple-simulators.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Test Apple simulators
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          device() {
            xcrun simctl list devices available -j | jq -er --arg kind "$1" '
              [.devices | to_entries[] | select(.key | test("iOS-|tvOS-"))]
              | sort_by(.key | split("-") | .[1:] | map(tonumber)) | reverse
              | map(.value[] | select(.deviceTypeIdentifier | contains($kind)))
              | first | .udid'
          }
          run_simulator() {
            report=$(mktemp)
            if sh build/apple/package.sh test "$@" 2>&1 | tee "$report"; then
              return
            fi
            if grep -Fq 'the simulator app ended without its exit code' "$report" && grep -Eq ' [0-9]+ passed, 1 failed, [0-9]+ skipped' "$report"; then
              sh build/apple/package.sh test "$@"
              return
            fi
            return 1
          }
          capture_tv_preview() {
            local simulator=$1 output=$2 bundle data ready
            bundle="$(sed -n 's/^id: *//p' nsgo.yaml).nsgotest"
            while :; do
              if data=$(xcrun simctl get_app_container "$simulator" "$bundle" data 2>/dev/null); then
                ready="$data/Library/Caches/waygu-tv-review-ready"
                if [[ -f "$ready" ]] && xcrun simctl io "$simulator" screenshot "$output/tv-home-trailer-display.png"; then
                  rm -f -- "$ready"
                fi
              fi
              sleep 0.2
            done
          }
          failed=0
          devices=(iPhone iPad Apple-TV)
          if [[ "$SCOPE" == apple-tv ]]; then
            devices=(Apple-TV)
          fi
          for kind in "${devices[@]}"; do
            if ! simulator=$(device "$kind"); then
              echo "::error::No available $kind simulator"
              failed=1
              continue
            fi
            target=ios_simulator
            tests='TestChineseAppName|TestNativeVideoDecodes|TestApplePlaybackNetworkMonitor'
            set -- -timeout 2m
            if [[ "$kind" == Apple-TV ]]; then
              target=tvos_simulator
              tests+='|TestTVNavigation|TestTVHomeNativeFixture'
              screenshots=dist/apple-tv-review
              mkdir -p "$screenshots"
              capture_tv_preview "$simulator" "$screenshots" &
              capture_pid=$!
              set -- "$@" -env WAYGU_CAPTURE_TV_DISPLAY=1 -screenshots "$screenshots"
            else
              tests+='|TestSkipOnboarding'
            fi
            echo "::group::$kind simulator tests"
            run_simulator -target "$target" -device "$simulator" -run "^($tests)$" "$@" . || failed=1
            if [[ "$kind" == Apple-TV ]]; then
              kill "$capture_pid" 2>/dev/null || true
              wait "$capture_pid" 2>/dev/null || true
              if [[ ! -s "$screenshots/tv-home-trailer-display.png" ]]; then
                echo "::error::The Apple TV display capture is missing"
                failed=1
              fi
            fi
            xcrun simctl shutdown "$simulator" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: waygu-video-apple-tv-review
          path: dist/apple-tv-review/
          retention-days: 7
          if-no-files-found: ignore

  mobile-packages:
    if: inputs.scope == 'all'
    name: Android, HarmonyOS and Web packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the packages
        run: go tool nsgo check -target android_arm64,harmonyos,web -jobs 2
      - name: Package the app
        run: |
          sh build/android/package.sh -installers=false
          go tool nsgo build -target harmonyos,web -jobs 2 -installers=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-harmonyos-web
          path: dist/releases/
          retention-days: 7
          if-no-files-found: error

  android:
    if: inputs.scope == 'all'
    name: Android / ${{ matrix.form }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {form: phone, api: 35, image: google_apis, profile: pixel_7}
          - {form: tablet, api: 35, image: google_apis, profile: pixel_tablet}
          - {form: tv, api: 36, image: android-tv, profile: tv_1080p}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Free disk space for Android virtual devices
        env:
          ANDROID_API: ${{ matrix.api }}
        run: |
          retained_ndk=$(realpath "$ANDROID_NDK_HOME")
          unused=()
          for ndk in "$ANDROID_HOME"/ndk/*; do
            if [ -f "$ndk/source.properties" ] && [ "$(realpath "$ndk")" != "$retained_ndk" ]; then
              unused+=("ndk;${ndk##*/}")
            fi
          done
          for platform in "$ANDROID_HOME"/platforms/*; do
            if [ -f "$platform/source.properties" ] && [ "${platform##*/}" != "android-$ANDROID_API" ]; then
              unused+=("platforms;${platform##*/}")
            fi
          done
          if (( ${#unused[@]} )); then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall "${unused[@]}"
          fi
          if command -v rustup >/dev/null; then
            rustup toolchain list | awk 'NF && $1 !~ /^no$/ {print $1}' | xargs -r rustup toolchain uninstall
          fi
          df -h "$ANDROID_HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android28-clang"
      - name: Build the Android TV launcher APK
        if: matrix.form == 'tv'
        run: sh build/android/package.sh -target android_x64 -output dist/android-tv
      - name: Run Android UI smoke tests
        if: matrix.form != 'tv'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          emulator-boot-timeout: 240
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect
          pre-emulator-launch-script: df -h "$ANDROID_AVD_HOME"
          script: sh build/android/emulator-test.sh ${{ matrix.form }}
      - name: Run the installed Android TV smoke test
        if: matrix.form == 'tv'
        env:
          ANDROID_IMAGE: system-images;android-${{ matrix.api }};${{ matrix.image }};x86_64
          ANDROID_PROFILE: ${{ matrix.profile }}
        run: sh build/android/run-tv-emulator.sh
      - name: Collect kernel diagnostics on failure
        if: failure()
        run: sudo dmesg --ctime --level=err,warn | tail -80

  integration:
    if: inputs.scope == 'all'
    name: Docker media servers and libmpv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmpv2
      - name: Start fixture servers
        run: |
          sh integration/servers/fixtures.sh
          docker compose -f integration/servers/compose.yaml up -d --wait --wait-timeout 150
          python3 integration/servers/bootstrap.py
      - name: Test playback and server compatibility
        env:
          GOFLAGS: "-p=1"
          WAYGU_TEST_SERVERS: "1"
          WAYGU_TEST_MPV: "1"
        run: go tool nsgo test ./... -count=1 -v
      - name: Collect logs for a failed test
        if: failure()
        run: docker compose -f integration/servers/compose.yaml logs --tail=80
      - name: Stop fixture servers
        if: always()
        run: docker compose -f integration/servers/compose.yaml down
