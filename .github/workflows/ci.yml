name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waygu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, target: macos_x64, native: macos}
          - {runner: macos-26, target: macos_arm64, native: macos}
          - {runner: ubuntu-24.04, target: linux_x64, native: linux}
          - {runner: ubuntu-24.04-arm, target: linux_arm64, native: linux}
          - {runner: windows-2025, target: windows_x64, native: windows}
          - {runner: windows-11-arm, target: windows_arm64, native: windows}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check and test
        shell: bash
        run: |
          go tool nsgo check -target ${{ matrix.target }}
          go tool nsgo test . -count=1 -v
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 xvfb xauth
      - name: Native window smoke test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a go tool nsgo test -target linux -run '^(TestChineseAppName|TestSkipOnboarding)$' -timeout 2m .
      - name: Native window smoke test
        if: runner.os != 'Linux'
        run: go tool nsgo test -target ${{ matrix.native }} -run '^(TestChineseAppName|TestSkipOnboarding)$' -timeout 2m .
      - name: Package desktop app
        shell: bash
        run: |
          go tool nsgo build -target ${{ matrix.target }} -installers=false
          tar -czf waygu-video-${{ matrix.target }}.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waygu-video-${{ matrix.target }}
          path: waygu-video-${{ matrix.target }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  apple:
    name: iOS and tvOS
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Apple device targets
        run: go tool nsgo check -target ios,tvos,ios_simulator,tvos_simulator -jobs 2
      - name: Build simulator apps
        run: go tool nsgo build -target ios_simulator,tvos_simulator -installers=false
      - name: Test on iPhone, iPad and Apple TV
        run: |
          set -euo pipefail
          device() {
            xcrun simctl list devices available -j | jq -er --arg kind "$1" '
              [.devices | to_entries[] | select(.key | test("iOS-|tvOS-"))]
              | sort_by(.key | split("-") | .[1:] | map(tonumber)) | reverse
              | map(.value[] | select(.deviceTypeIdentifier | contains($kind)))
              | first | .udid'
          }
          for kind in iPhone iPad; do
            simulator=$(device "$kind")
            go tool nsgo test -target ios_simulator -device "$simulator" -run '^(TestChineseAppName|TestSkipOnboarding)$' -timeout 2m .
            xcrun simctl shutdown "$simulator"
          done
          go tool nsgo test -target tvos_simulator -device "$(device Apple-TV)" -run '^TestChineseAppName$' -timeout 2m .
      - name: Archive simulator apps
        run: tar -czf waygu-video-apple-simulators.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waygu-video-apple-simulators
          path: waygu-video-apple-simulators.tar.gz
          retention-days: 7
          if-no-files-found: error

  mobile-packages:
    name: Android, HarmonyOS and Web packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the packages
        run: go tool nsgo check -target android_arm64,harmonyos,web -jobs 2
      - name: Package the app
        run: go tool nsgo build -target android_arm64,harmonyos,web -jobs 2 -installers=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-harmonyos-web
          path: dist/releases/
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UI smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ndk: 27.2.12479018
          script: go tool nsgo test -target android -device emulator-5554 -run '^(TestChineseAppName|TestSkipOnboarding)$' -timeout 2m .

  integration:
    name: Docker media servers and libmpv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmpv2
      - name: Start fixture servers
        run: |
          sh integration/servers/fixtures.sh
          docker compose -f integration/servers/compose.yaml up -d
          python3 integration/servers/bootstrap.py
      - name: Test playback and server compatibility
        env:
          WAYGU_TEST_SERVERS: "1"
          WAYGU_TEST_MPV: "1"
        run: go tool nsgo test . -count=1 -v
      - name: Collect logs for a failed test
        if: failure()
        run: docker compose -f integration/servers/compose.yaml logs --tail=80
      - name: Stop fixture servers
        if: always()
        run: docker compose -f integration/servers/compose.yaml down
